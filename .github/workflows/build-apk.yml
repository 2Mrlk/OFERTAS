name: Construir APK Android

"on":
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Gerar APK Debug
    runs-on: ubuntu-latest
    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Dependencias
        run: npm install

      - name: Compilar Frontend
        run: npm run build

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Permissao Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK
        run: cd android && ./gradlew assembleDebug

      - name: Publicar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: monitor-de-ofertas-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk